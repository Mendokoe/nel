name: Build

on:
  push:
    branches:
      - staging
      - 86hm
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:bookworm

    env:
      CI: "1"

    steps:
      - name: Set branch variables (staging)
        if: github.ref == 'refs/heads/staging'
        run: |
          echo "RELEASE=0" >> "$GITHUB_ENV"

      - name: Set branch variables (86hm)
        if: github.ref == 'refs/heads/86hm'
        run: |
          echo "RELEASE=1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git make curl unzip zip xz-utils zstd default-jre \
            build-essential flex bison bc python3 rsync cpio ca-certificates \
            libssl-dev libelf-dev zlib1g-dev perl pahole dwarves lz4
          rm -rf /var/lib/apt/lists/*

      - name: Configure git
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --add safe.directory '*'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download build script & Patch Custom Name
        run: |
          curl -fsSLO https://raw.githubusercontent.com/Reinazhard/scripts/refs/heads/main/raviole/build.sh
          sed -i 's/echo "${lv}"/echo "${lv}-繁星"/' build.sh

      - name: Build Standard (KSU=0)
        working-directory: ${{ github.workspace }}
        run: |
          KBUILD_BUILD_USER="繁星" \
          KBUILD_BUILD_HOST="Cethem" \
          KSU=0 bash build.sh

      - name: Build KernelSU (KSU=1)
        working-directory: ${{ github.workspace }}
        run: |
          KBUILD_BUILD_USER="繁星" \
          KBUILD_BUILD_HOST="Cethem-K" \
          KSU=1 bash build.sh

      - name: Collect artifacts
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/artifacts
          find . -name "*.zip" -not -path "./.git/*" -exec cp {} /tmp/artifacts/ \;
          ls -la /tmp/artifacts/

      - name: Upload kernel zips to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: kernel-builds-${{ github.ref_name }}
          path: /tmp/artifacts/*.zip
          if-no-files-found: error
          compression-level: 0
